<script>
/* Motor de estoque Açaí-se — funções puras, sem DOM. Portável para o acaise-central.
 * Convenções:
 *  - counts[data][itemId]   = estoque contado no FECHAMENTO do dia
 *  - receipts[data][itemId] = quantidade recebida (entrada) naquele dia
 *  - consumo(d) = contagem(d-1) + entrada(d) - contagem(d)
 *  - Ciclo: pede domingo -> recebe segunda; pede quarta -> recebe quinta
 */
const Engine = (() => {
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const dow = s => parse(s).getDay(); // 0 = domingo
  const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

  const ORDER_DAYS = [0, 3];     // domingo, quarta
  const DELIVERY_DAYS = [1, 4];  // segunda, quinta

  function consumption(S, item, d) {
    if (S.noReceipt?.[d]?.[item.id]) return null;   // entrada não registrada nesse dia
    const c0 = S.counts[addDays(d, -1)]?.[item.id];
    const c1 = S.counts[d]?.[item.id];
    if (c0 == null || c1 == null) return null;
    return c0 + (S.receipts[d]?.[item.id] || 0) - c1;
  }

  // histórico de consumos válidos (>= 0) nos `n` dias anteriores a `before`
  function history(S, item, before, n) {
    const out = [];
    for (let i = 1; i <= n; i++) {
      const d = addDays(before, -i);
      const c = consumption(S, item, d);
      if (c != null && c >= 0) out.push({ d, c });
    }
    return out;
  }

  function avgDaily(S, item, before) {
    return mean(history(S, item, before, 14).map(x => x.c));
  }

  // previsão para um dia: média do mesmo dia da semana nas últimas 4 semanas;
  // sem histórico daquele dia, usa a média diária recente
  function forecastDay(S, item, date, before) {
    const same = history(S, item, before, 28).filter(x => dow(x.d) === dow(date)).map(x => x.c);
    return same.length ? mean(same) : avgDaily(S, item, before);
  }

  function sumForecast(S, item, from, to, before) {
    let t = 0;
    for (let d = from; d <= to; d = addDays(d, 1)) t += forecastDay(S, item, d, before);
    return t;
  }

  function lastCountDate(S) {
    const k = Object.keys(S.counts).filter(d => Object.keys(S.counts[d] || {}).length).sort();
    return k.length ? k[k.length - 1] : null;
  }

  function nextOrderDays(today, n = 2) {
    const out = [];
    for (let i = 0; out.length < n && i < 21; i++) {
      const d = addDays(today, i);
      if (ORDER_DAYS.includes(dow(d))) out.push(d);
    }
    return out;
  }

  // Plano do pedido feito em `O` (data do dia de pedido)
  function plan(S, O) {
    const L = lastCountDate(S);
    if (!L) return null;
    const before = addDays(L, 1);            // histórico só até a última contagem
    const D = addDays(O, 1);                 // dia de entrega
    let nd = addDays(D, 1);
    while (!DELIVERY_DAYS.includes(dow(nd))) nd = addDays(nd, 1);
    const coverDays = diffDays(D, nd);       // dias que este pedido precisa cobrir
    const lastCovered = addDays(nd, -1);

    const rows = S.items.map(it => {
      const h = history(S, it, before, 14);
      const avg = mean(h.map(x => x.c));
      let stock = null, projected = false, staleFrom = null;
      if (S.counts[O]?.[it.id] != null) stock = S.counts[O][it.id];
      else {
        let Li = L;
        while (S.counts[Li]?.[it.id] == null && diffDays(Li, L) < 14) Li = addDays(Li, -1);
        if (S.counts[Li]?.[it.id] != null) {
          projected = O > Li;
          let inflow = 0;   // entradas já lançadas entre a última contagem e o dia do pedido
          for (let d = addDays(Li, 1); d <= O; d = addDays(d, 1)) inflow += S.receipts[d]?.[it.id] || 0;
          stock = Math.max(0, S.counts[Li][it.id] + inflow - (O > Li ? sumForecast(S, it, addDays(Li, 1), O, before) : 0));
          if (Li < L) staleFrom = Li;
        }
      }
      const need = sumForecast(S, it, D, lastCovered, before);
      const safety = (it.safetyDays || 0) * avg;
      const ceiling = Math.max((it.maxDays || 99) * avg, need); // teto nunca abaixo da necessidade
      const target = Math.min(need + safety, ceiling);
      const st = stock == null ? 0 : Math.max(stock, 0);
      let raw = Math.max(0, target - st);
      const pack = it.pack || 1;
      const packs = Math.max(0, Math.ceil(raw / pack - 1e-9)) || 0;   // sempre para cima, em embalagens fechadas
      const qty = packs * pack;
      const notes = [];
      if (stock == null) notes.push('sem contagem');
      if (staleFrom) notes.push(`sem contagem recente: última em ${staleFrom.slice(8)}/${staleFrom.slice(5, 7)}`);
      if (h.length === 0) notes.push('sem histórico de consumo');
      else if (avg === 0) notes.push('consumo zero nos dias medidos: conferir contagem');
      else if (h.length < 4) notes.push(`histórico curto (${h.length} dias)`);
      if (it.shelfDays && coverDays > it.shelfDays) notes.push(`validade (${it.shelfDays} d) menor que a cobertura (${coverDays} d)`);
      if (qty === 0 && st > target && avg > 0) notes.push('estoque acima do alvo');
      return { item: it, avg, stock, projected, need, safety, target, qty, packs, value: qty * (it.cost || 0), notes };
    });
    return { O, D, nd, coverDays, L, rows, total: rows.reduce((s, r) => s + r.value, 0) };
  }

  function revenueAvg(S, before) {
    const v = [];
    for (let i = 1; i <= 14; i++) {
      const r = S.revenue[addDays(before, -i)];
      if (r != null && r > 0) v.push(r);
    }
    return v.length ? mean(v) : (S.revRef || 0);   // sem lançamentos, usa a média de referência
  }

  // CMV real = consumo valorizado / faturamento, nos `n` dias até `upTo` (inclusive)
  function realCMV(S, upTo, n = 7) {
    let cost = 0, rev = 0, days = 0;
    for (let i = 0; i < n; i++) {
      const d = addDays(upTo, -i);
      if (S.start && d < S.start) continue;   // CMV real só vale a partir do início do controle
      const r = S.revenue[d];
      if (!(r > 0)) continue;
      let c = 0, ok = false;
      S.items.forEach(it => { const x = consumption(S, it, d); if (x != null) { c += Math.max(x, 0) * (it.cost || 0); ok = true; } });
      if (!ok) continue;
      cost += c; rev += r; days++;
    }
    return { cost, rev, days, cmv: rev > 0 ? cost / rev : null };
  }

  // Situação de cada item na última contagem
  function status(S) {
    const L = lastCountDate(S);
    if (!L) return [];
    const before = addDays(L, 1);
    let nd = addDays(L, 1);
    while (!DELIVERY_DAYS.includes(dow(nd))) nd = addDays(nd, 1);
    return S.items.map(it => {
      const stock = S.counts[L]?.[it.id];
      const avg = avgDaily(S, it, before);
      const coverage = avg > 0 && stock != null ? stock / avg : null;
      const untilDelivery = sumForecast(S, it, addDays(L, 1), addDays(nd, -1), before);
      const max = (it.maxDays || 99) * avg;
      const excessQty = stock != null && avg > 0 ? Math.max(0, stock - max) : 0;
      let state = 'ok';
      if (stock == null || avg === 0) state = 'na';
      else if (stock < untilDelivery) state = 'low';
      else if (excessQty > 0) state = 'high';
      return { item: it, stock, avg, coverage, untilDelivery, excessQty, excessValue: excessQty * (it.cost || 0), stockValue: (stock || 0) * (it.cost || 0), state };
    });
  }

  return { iso, parse, addDays, dow, diffDays, mean, consumption, avgDaily, forecastDay, sumForecast, lastCountDate, nextOrderDays, plan, revenueAvg, realCMV, status, ORDER_DAYS, DELIVERY_DAYS };
})();
if (typeof module !== 'undefined') module.exports = Engine;

/* Dados de exemplo: custos e consumos são ilustrativos, para ver o sistema funcionando. */
function makeDemo(today) {
  const E = Engine;
  const items = [
    { id: 'acai',   name: 'Polpa de açaí',        unit: 'kg',  cost: 23.04, pack: 10, shelfDays: null, safetyDays: 0.5, maxDays: 6, base: 14 },
    { id: 'ciab',   name: 'Pão ciabatta',         unit: 'un',  cost: 2.4,   pack: 12, shelfDays: 3,    safetyDays: 0.5, maxDays: 3, base: 9 },
    { id: 'frango', name: 'Proteína: frango',     unit: 'porção', cost: 6.8, pack: 5, shelfDays: 4,   safetyDays: 0.5, maxDays: 4, base: 8 },
    { id: 'atum',   name: 'Proteína: atum',       unit: 'porção', cost: 7.9, pack: 5, shelfDays: 4,   safetyDays: 0.5, maxDays: 4, base: 4 },
    { id: 'wrap',   name: 'Disco de wrap',        unit: 'un',  cost: 1.15,  pack: 10, shelfDays: null, safetyDays: 0.5, maxDays: 5, base: 11 },
    { id: 'molho',  name: 'Molho de wrap',        unit: 'ml',  cost: 0.019, pack: 500, shelfDays: 7,   safetyDays: 0.5, maxDays: 5, base: 900 },
    { id: 'granola',name: 'Granola',              unit: 'g',   cost: 0.0145,pack: 1000, shelfDays: null, safetyDays: 1,  maxDays: 7, base: 2200 },
    { id: 'leite',  name: 'Leite em pó',          unit: 'g',   cost: 0.031, pack: 1000, shelfDays: null, safetyDays: 1,  maxDays: 8, base: 800 },
    { id: 'morango',name: 'Morango',              unit: 'g',   cost: 0.017, pack: 1000, shelfDays: 4,   safetyDays: 0.5, maxDays: 4, base: 2600 },
    { id: 'banana', name: 'Banana',               unit: 'un',  cost: 0.62,  pack: 12, shelfDays: 4,    safetyDays: 0.5, maxDays: 4, base: 24 },
    { id: 'c300',   name: 'Copo 300 ml',          unit: 'un',  cost: 0.38,  pack: 50, shelfDays: null, safetyDays: 1,   maxDays: 10, base: 38 },
    { id: 'c500',   name: 'Copo 500 ml',          unit: 'un',  cost: 0.52,  pack: 50, shelfDays: null, safetyDays: 1,   maxDays: 10, base: 22 },
  ];
  // sexta a domingo vendem mais

  const el = $('#t-supply');
  const dl = E.DELIVERY_DAYS.includes(E.dow(sDate));
  let lastG = null;
  const rows = S.items.map(it => {
    const g = it.group || 'Outros';
    const head = g !== lastG ? `<div class="grp">${esc(g)}</div>` : ''; lastG = g;
    const rec = S.receipts[sDate]?.[it.id];
    const pk = it.pack > 1 ? it.pack : 1;
    const packs = rec ? Math.floor(rec / pk) : '', loose = rec ? rec % pk : '';
    const flag = S.noReceipt?.[sDate]?.[it.id] ? '<span class="chip warn">estoque subiu sem entrada lançada</span>' : '';
    return `${head}<div class="row sup" data-id="${it.id}" data-pk="${pk}">
      <div class="nm">${esc(it.name)}<small>${esc(it.unit)}${pk > 1 ? ` · embalagem com ${pk}` : ''}</small></div>
      <label class="f"><span class="lbl">${pk > 1 ? 'Embalagens' : 'Quantidade'}</span><input type="number" inputmode="numeric" min="0" step="1" data-k="p" value="${packs}" placeholder="0"></label>
      ${pk > 1 ? `<label class="f"><span class="lbl">Avulsas (un)</span><input type="number" inputmode="numeric" min="0" step="1" data-k="l" value="${loose || ''}" placeholder="0"></label>` : '<span></span>'}
      <div class="calc">${rec ? `Total: <b>${num(rec)} ${esc(it.unit)}</b> (${brl(rec * it.cost)})` : ''} ${flag}</div>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="bar"><label class="f">Data em que a mercadoria CHEGOU na loja<input type="date" id="sDt" value="${sDate}"></label>
      <div class="progress" id="sTot"></div></div>
    <div class="how"><b>Uso do escritório</b> — a loja não mexe aqui.
      <ol>
        <li>Escolha a data em que a mercadoria <b>chegou</b> na loja (o pedido de domingo chega na segunda, o de quarta chega na quinta). Retirada vale a data da retirada.</li>
        <li>Digite o número de <b>embalagens</b> de cada item (caixa de 5 barras, caixa de 24 picolés, pacote de 10 discos...). Barra solta vai em Avulsas.</li>
      </ol>
      <div class="sub" style="margin-top:8px">${dl ? 'Dia de entrega do ciclo.' : 'Atenção: esta data não é segunda nem quinta, então conta como abastecimento fora do ciclo.'} Em breve estes lançamentos virão sozinhos do pedido de abastecimento do ERP.</div></div>
    <div class="list">${rows}</div>`;
  const tot = () => { const v = S.items.reduce((a, it) => a + (S.receipts[sDate]?.[it.id] || 0) * it.cost, 0); $('#sTot').textContent = `Total lançado na data: ${brl(v)}`; };
  tot();
  $('#sDt').onchange = e => { sDate = e.target.value || today; renderSupply(); };
  el.querySelectorAll('.row').forEach(r => r.querySelectorAll('input').forEach(inp => inp.oninput = () => {
    const id = r.dataset.id, pk = +r.dataset.pk;
    const p = parseFloat(r.querySelector('[data-k=p]').value) || 0, l = parseFloat(r.querySelector('[data-k=l]')?.value) || 0;
    const q = Math.ceil(p) * pk + Math.ceil(l);
    S.receipts[sDate] = S.receipts[sDate] || {};
    if (q > 0) { S.receipts[sDate][id] = q; if (S.noReceipt?.[sDate]) delete S.noReceipt[sDate][id]; } else delete S.receipts[sDate][id];
    const it = S.items.find(i => i.id === id);
    r.querySelector('.calc').innerHTML = q > 0 ? `Total: <b>${num(q)} ${esc(it.unit)}</b> (${brl(q * it.cost)})` : '';
    save(); tot();
  }));
}

/* ---------- Faturamento ---------- */
let rMonth = today.slice(0, 7);
function renderRev() {
  const el = $('#t-rev');
  const days = Object.keys(S.revenue).filter(d => d.startsWith(rMonth) && S.revenue[d] > 0).sort();
  const sum = k => days.reduce((a, d) => a + (S.revSplit[d]?.[k] || 0), 0);
  const total = days.reduce((a, d) => a + S.revenue[d], 0);
  const split = CH.reduce((a, [k]) => a + sum(k), 0);
  const mix = v => split > 0 ? pct(v / split) : '—';
  const trs = days.map(d => `<tr><td>${label(d)}</td>${CH.map(([k]) => `<td>${S.revSplit[d]?.[k] != null ? brl(S.revSplit[d][k]) : '—'}</td>`).join('')}<td><b>${brl(S.revenue[d])}</b></td></tr>`).join('');
  const b = S.baseline?.canais;
  el.innerHTML = `<div class="stack">
    <div class="bar"><label class="f">Mês<input type="month" id="rMonth" value="${rMonth}"></label></div>
    <div class="kpis">
      <div class="kpi"><div class="k">Faturamento no mês</div><div class="v">${brl(total)}</div><div class="d">${days.length} dias lançados${days.length ? ` · média ${brl(total / days.length)} por dia` : ''}</div></div>
      ${CH.map(([k, n]) => `<div class="kpi"><div class="k">${n}</div><div class="v">${brl(sum(k))}</div><div class="d">${mix(sum(k))} do total por canal</div></div>`).join('')}
    </div>
    ${days.length ? `<div class="tw"><table><thead><tr><th>Dia</th>${CH.map(([, n]) => `<th>${n}</th>`).join('')}<th>Total</th></tr></thead><tbody>${trs}</tbody>
      <tfoot><tr><td>Total do mês</td>${CH.map(([k]) => `<td>${brl(sum(k))}</td>`).join('')}<td>${brl(total)}</td></tr></tfoot></table></div>` : '<p class="empty">Nenhum faturamento lançado neste mês. A loja lança as vendas de cada canal no fechamento do dia.</p>'}
    ${b ? `<div><h2>Referência: ${esc(S.baseline.label)}</h2><div class="tw"><table><thead><tr><th>Canal</th><th>Valor</th><th>Participação</th></tr></thead><tbody>
      ${b.map(c => `<tr><td>${esc(c.nome)}</td><td>${brl(c.valor)}</td><td>${pct(c.valor / S.baseline.receita)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Total</td><td>${brl(S.baseline.receita)}</td><td>100%</td></tr></tfoot></table></div></div>` : ''}
  </div>`;
  $('#rMonth').onchange = e => { rMonth = e.target.value || today.slice(0, 7); renderRev(); };
}

/* ---------- Painel ---------- */
function renderPanel() {
  const el = $('#t-panel');
  const L = E.lastCountDate(S);
  if (!L) { el.innerHTML = '<p class="empty">Sem contagens ainda.</p>'; return; }
  const st = E.status(S);
  const c7 = E.realCMV(S, L, 7);
  const stockValue = st.reduce((a, s) => a + s.stockValue, 0);
  const excess = st.reduce((a, s) => a + s.excessValue, 0);
  let bought = 0;
  const started = !S.start || L >= S.start;
  for (let i = 0; i < 7; i++) { const d = E.addDays(L, -i); if (S.start && d < S.start) continue; S.items.forEach(it => bought += (S.receipts[d]?.[it.id] || 0) * it.cost); }
  let supDays = 0, supOff = 0;
  for (let i = 0; i < 14; i++) { const d = E.addDays(L, -i); if (S.start && d < S.start) continue; const rc = S.receipts[d]; if (rc && Object.values(rc).some(v => v > 0)) { supDays++; if (!E.DELIVERY_DAYS.includes(E.dow(d))) supOff++; } }
  const over = c7.cmv != null && c7.cmv > S.cmvMeta / 100;
  const low = st.filter(s => s.state === 'low'), high = st.filter(s => s.state === 'high').sort((a, b) => b.excessValue - a.excessValue);
  // divergências: consumo negativo ou muito acima do esperado nos últimos 7 dias
  const anomalies = [];
  for (let i = 0; i < 7; i++) {
    const d = E.addDays(L, -i);
    S.items.forEach(it => {
      const c = E.consumption(S, it, d); if (c == null) return;
      const exp = E.forecastDay(S, it, d, d);
      if (c < 0) anomalies.push({ d, it, text: `consumo negativo (${num(c, 2)} ${it.unit}). Conferir contagem ou entrada`, kind: 'crit', w: 1e9 });
      else if (exp > 0 && c > exp * 1.5 && (c - exp) * it.cost > 5) anomalies.push({ d, it, text: `saiu ${num(c, 1)} ${it.unit}, esperado ${num(exp, 1)}`, kind: 'warn', w: (c - exp) * it.cost });
    });
  }
  anomalies.sort((a, b) => b.w - a.w);
  const repeated = S.items.map(it => { const v = S.counts[L]?.[it.id]; if (v == null) return null; let n = 0; for (let d = L; S.counts[d]?.[it.id] === v; d = E.addDays(d, -1)) n++; return n >= 4 ? { it, v, n } : null; }).filter(Boolean);
  const stateLabel = { ok: 'Adequado', low: 'Falta antes da entrega', high: 'Excesso', na: 'Sem dados' };
  const trs = st.map(s => `<tr><td>${esc(s.item.name)}</td><td>${num(s.stock, 1)} ${esc(s.item.unit)}</td><td>${s.coverage == null ? '—' : num(s.coverage, 1) + ' d'}</td>
    <td><span class="meter" aria-hidden="true"><i class="${s.state}" style="width:${s.coverage == null ? 0 : Math.min(100, s.coverage / ((s.item.maxDays || 7) * 1.25) * 100)}%"></i></span></td>
    <td>${s.item.maxDays ? s.item.maxDays + ' d' : '—'}</td><td>${brl(s.stockValue)}</td><td><span class="chip ${s.state}">${stateLabel[s.state]}</span></td></tr>`).join('');
  el.innerHTML = `<div class="stack">
    <div class="kpis">
      <div class="kpi"><div class="k">CMV real, últimos 7 dias</div><div class="v" style="color:${c7.cmv == null ? 'inherit' : over ? 'var(--crit)' : 'var(--ok)'}">${pct(c7.cmv)}</div><div class="d">Meta ${num(S.cmvMeta, 0)}%${c7.days ? ` · ${c7.days} dias com faturamento` : ' · informe o faturamento diário'}</div></div>
      <div class="kpi"><div class="k">Entradas lançadas, 7 dias</div><div class="v">${started ? brl(bought) : '—'}</div><div class="d">Consumido: ${brl(c7.cost)}</div></div>
      <div class="kpi"><div class="k">Dias com abastecimento, 14 dias</div><div class="v" style="color:${supOff > 0 ? 'var(--warn)' : 'inherit'}">${started ? supDays : '—'}</div><div class="d">${started ? `${supOff} fora de segunda e quinta. ` : ''}Ciclo: 2 por semana${S.start ? ` · desde ${S.start.slice(8)}/${S.start.slice(5, 7)}` : ''}</div></div>
      <div class="kpi"><div class="k">Estoque na prateleira</div><div class="v">${brl(stockValue)}</div><div class="d">Contagem de ${label(L)}</div></div>
      <div class="kpi"><div class="k">Excesso acima do teto</div><div class="v" style="color:${excess > 0 ? 'var(--warn)' : 'inherit'}">${brl(excess)}</div><div class="d">${high.length} itens acima do teto de dias</div></div>
    </div>
    ${S.baseline ? (() => { const b = S.baseline, alvo = b.receita * S.cmvMeta / 100; return `<div class="callout"><div><div class="sub">Compras na DRE, ${esc(b.label)}</div><div class="big">${brl(b.cmv)}</div></div><div class="sub" style="max-width:640px">${pct(b.cmv / b.receita)} da receita bruta de ${brl(b.receita)}. Na meta de ${num(S.cmvMeta)}% seriam ${brl(alvo)}, uma diferença de <b>${brl(b.cmv - alvo)}</b> no mês. O CMV da DRE conta o que foi comprado. O CMV real do sistema conta o que foi consumido: compras + estoque inicial − estoque final.</div></div>`; })() : ''}
    <div class="cols">
      <div><h2>Risco de faltar antes da entrega</h2>${low.length ? `<ul class="mini">${low.map(s => `<li><span>${esc(s.item.name)}</span><span>${num(s.stock, 1)} de ${num(s.untilDelivery, 1)} ${esc(s.item.unit)} necessários</span></li>`).join('')}</ul>` : '<p class="empty">Nenhum item abaixo do necessário até a próxima entrega.</p>'}</div>
      <div><h2>Divergências nos últimos 7 dias</h2>${anomalies.length ? `<ul class="mini">${anomalies.slice(0, 6).map(a => `<li><span>${esc(a.it.name)} · ${label(a.d)}</span><span class="chip ${a.kind}">${esc(a.text)}</span></li>`).join('')}</ul>` : '<p class="empty">Nada fora do padrão.</p>'}</div>
      <div><h2>Contagem repetida</h2>${repeated.length ? `<ul class="mini">${repeated.map(x => `<li><span>${esc(x.it.name)}</span><span class="chip info">${num(x.v)} há ${x.n} dias seguidos</span></li>`).join('')}</ul><p class="sub" style="margin:6px 0 0">Pode ser estoque parado ou número copiado do dia anterior.</p>` : '<p class="empty">Nenhum item com a mesma contagem por 4 dias ou mais.</p>'}</div>
    </div>
    <div><h2>Cobertura por item</h2><p class="sub" style="margin:0 0 8px">Quantos dias de venda o estoque atual cobre, com o consumo médio recente.</p>
      <div class="tw"><table><thead><tr><th>Item</th><th>Estoque</th><th>Cobre</th><th></th><th>Teto</th><th>Valor parado</th><th>Situação</th></tr></thead><tbody>${trs}</tbody></table></div></div>
  </div>`;
}

/* ---------- Itens ---------- */
let confirmWipe = false;
function renderItems() {
  const el = $('#t-items');
  const f = (it, k, step = 'any') => `<td><input type="number" min="0" step="${step}" data-k="${k}" value="${it[k] ?? ''}" aria-label="${k} de ${esc(it.name)}"></td>`;
  const trs = S.items.map(it => `<tr data-id="${it.id}">
    <td><input type="text" data-k="name" value="${esc(it.name)}" style="width:200px" aria-label="Nome"></td>
    <td><input type="text" data-k="unit" value="${esc(it.unit)}" style="width:70px" aria-label="Unidade"></td>
    ${f(it, 'cost')}${f(it, 'pack')}${f(it, 'shelfDays')}${f(it, 'safetyDays')}${f(it, 'maxDays')}
    <td><button class="btn danger" data-del="${it.id}" aria-label="Remover ${esc(it.name)}">Remover</button></td></tr>`).join('');
  el.innerHTML = `<div class="stack">
    <div class="bar">
      <label class="f">Loja<input type="text" id="sStore" value="${esc(S.store)}" style="width:180px"></label>
      <label class="f">Faturamento médio por dia (R$)<input type="number" id="sRev" min="0" step="any" value="${S.revRef ?? ''}" style="width:130px"></label>
      <label class="f">Meta de CMV (%)<input type="number" id="sMeta" min="1" max="100" value="${S.cmvMeta}"></label>
    </div>
    <div><h2>Itens controlados</h2><p class="sub" style="margin:0 0 8px">Custo por unidade. Embalagem é o múltiplo de compra (proteína vem de 5 em 5, disco de wrap de 10 em 10). Segurança é a folga em dias de venda. Teto é o máximo de dias de estoque que a loja deve manter.</p>
      <div class="tw"><table><thead><tr><th>Nome</th><th>Unidade</th><th>Custo (R$)</th><th>Embalagem</th><th>Validade (dias)</th><th>Segurança (dias)</th><th>Teto (dias)</th><th></th></tr></thead><tbody>${trs}</tbody></table></div></div>
    <div class="bar"><button class="btn ghost" id="sAdd">Adicionar item</button>
      <button class="btn ghost" id="sReal">Carregar histórico real de 20 a 29/09 (substitui os dados atuais)</button>
      <button class="btn ghost" id="sDemo">Recarregar dados de exemplo</button>
      ${confirmWipe ? '<span class="sub">Apagar todos os itens e lançamentos?</span><button class="btn danger" id="sWipeYes">Sim, apagar tudo</button><button class="btn ghost" id="sWipeNo">Cancelar</button>' : '<button class="btn danger" id="sWipe">Apagar tudo e começar do zero</button>'}</div>
  </div>`;
  const bind = (id, fn) => { const n = $(id); if (n) n.onclick = fn; };
  $('#sStore').oninput = e => { S.store = e.target.value; save(); $('#storeLine').textContent = S.store; };
  $('#sRev').oninput = e => { const v = parseFloat(e.target.value); S.revRef = isNaN(v) ? 0 : v; save(); };
  $('#sMeta').oninput = e => { S.cmvMeta = parseFloat(e.target.value) || 35; save(); };
  el.querySelectorAll('tbody tr').forEach(tr => tr.querySelectorAll('input').forEach(inp => inp.oninput = () => {
    const it = S.items.find(i => i.id === tr.dataset.id), k = inp.dataset.k;
    it[k] = inp.type === 'number' ? (inp.value === '' ? null : parseFloat(inp.value)) : inp.value;
    save();
  }));
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.items = S.items.filter(i => i.id !== b.dataset.del); save(); renderItems(); });
  bind('#sAdd', () => { S.items.push({ id: 'i' + Date.now().toString(36), name: 'Novo item', unit: 'un', cost: 0, pack: 1, shelfDays: null, safetyDays: 0.5, maxDays: 5 }); save(); renderItems(); });
  bind('#sDemo', () => { S = makeDemo(today); save(); renderAll(); toast('Dados de exemplo recarregados'); });
  bind('#sReal', () => { S = makeReal(); save(); renderAll(); toast('Histórico real carregado'); });
  bind('#sWipe', () => { confirmWipe = true; renderItems(); });
  bind('#sWipeNo', () => { confirmWipe = false; renderItems(); });
  bind('#sWipeYes', () => { S = { store: S.store, cmvMeta: S.cmvMeta, items: [], counts: {}, receipts: {}, revenue: {}, revSplit: {}, demo: false }; confirmWipe = false; save(); renderAll(); toast('Tudo apagado'); });
}

function render() {
  $('#storeLine').textContent = S.store;
  const bn = $('#demoBanner'); const msg = S.demo ? 'Dados de exemplo.' : ''; bn.textContent = msg; bn.hidden = !msg;
  if (tab === 'count') renderCount(); else if (tab === 'order') renderOrder(); else if (tab === 'supply') renderSupply(); else if (tab === 'rev') renderRev(); else if (tab === 'panel') renderPanel(); else renderItems();
}
function renderAll() { render(); }
/* ---------- Banco de dados (Supabase, sem login: acesso por PIN da loja) ---------- */
const CFG = window.ACAISE_CFG;
let timers = {}, dirty = new Set(), dbMsg = ['Conectando...', false];
const setDbState = (t, bad) => { const n = $('#dbState'); if (n) { n.textContent = t; n.style.color = bad ? 'var(--warn)' : ''; } };
const getPin = () => { try { return localStorage.getItem('acaise_pin') || ''; } catch (e) { return ''; } };
async function rpc(fn, args) {
  const r = await fetch(CFG.url + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
  if (!r.ok) { const t = await r.text(); throw new Error(t.includes('pin_invalido') ? 'pin' : 'HTTP ' + r.status + ' ' + t.slice(0, 140)); }
  return r.json();
}
function dayPayload(d) { return { p_pin: getPin(), p_data: d, p_loja: S.store, p_contagem: S.counts[d] || {}, p_vendas: S.revSplit[d] || {}, p_total: revTotal(d) || 0 }; }
function saveDay(d) {
  dirty.add(d); clearTimeout(timers[d]);
  setDbState('Salvando...');
  timers[d] = setTimeout(() => flush(d), 700);
}
async function flush(d) {
  try { await rpc('est_salvar', dayPayload(d)); dirty.delete(d); dbMsg = ['Salvo ✓', false]; }
  catch (e) {
    if (e.message === 'pin') { askPin(); return; }
    dbMsg = ['Ainda não salvou (' + e.message + '). Tentando de novo...', true]; clearTimeout(timers[d]); timers[d] = setTimeout(() => flush(d), 8000);
  }
  setDbState(...dbMsg);
}
function askPin() {
  const el = $('#pinBox'); el.hidden = false;
  el.innerHTML = '<div class="how"><b>Digite o PIN da loja</b><div class="bar" style="margin:8px 0 0"><input type="password" id="pinIn" inputmode="numeric" style="width:140px;text-align:left"><button class="btn" id="pinOk">Entrar</button></div><div id="pinErr" class="sub" style="color:var(--crit)"></div></div>';
  $('#pinOk').onclick = async () => {
    const v = $('#pinIn').value.trim();
    try { localStorage.setItem('acaise_pin', v); } catch (e) {}
    try { await loadRemote(); el.hidden = true; dirty.forEach(d => flush(d)); } catch (e) { $('#pinErr').textContent = e.message === 'pin' ? 'PIN incorreto.' : 'Sem conexão.'; }
  };
}
async function loadRemote() {
  const rows = await rpc('est_ler', { p_pin: getPin(), p_desde: E.addDays(today, -45) });
  rows.forEach(v => {
    const d = v.data; if (dirty.has(d)) return;
    S.counts[d] = v.contagem || {};
    if (v.vendas && Object.keys(v.vendas).length) { S.revSplit[d] = v.vendas; S.revenue[d] = revTotal(d); }
  });
  save(); dbMsg = ['Conectado', false]; render();
}
async function initDb() {
  if (!getPin()) { askPin(); return; }
  try { await loadRemote(); } catch (e) { if (e.message === 'pin') askPin(); else { dbMsg = ['Sem conexão com o banco: ' + e.message, true]; setDbState(...dbMsg); } }
}
render();
initDb();
})();
</script>
